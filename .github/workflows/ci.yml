name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      # Report both platforms on every run. With the default fail-fast,
      # whichever leg failed first cancelled the other mid-step, so a red
      # push taught you nothing about the platform that got cancelled —
      # and for a macOS-first tool that is usually the leg you needed.
      # It also makes a darwin-only test unprovable from a red push: the
      # macOS leg has to reach the failure and name it (gh#215).
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Full history so golangci-lint's new-from-merge-base can diff
          # against origin/main (see issues block in .golangci.yml).
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: latest

      - name: Format check
        run: |
          go install mvdan.cc/gofumpt@latest
          UNFORMATTED=$(gofumpt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # govulncheck has no ignore flag, so filter known-unfixable
          # advisories out of the JSON output and fail on anything else.
          # GO-2026-5932: x/crypto/openpgp is unmaintained with no fixed
          # version; reached via sigstore-go's testing CA -> rekor
          # pkg/pki, which supports PGP keys by design. Drop the entry
          # from IGNORE if that import chain ever goes away.
          IGNORE='GO-2026-5932'
          govulncheck -format json ./... > vulns.json
          FOUND=$(jq -r 'select(.finding.trace[0].function != null) | .finding.osv' vulns.json | sort -u | grep -vxF "$IGNORE" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::govulncheck found vulnerabilities:"
            echo "$FOUND"
            exit 1
          fi
          echo "no findings beyond ignored advisories ($IGNORE)"

      - name: Build
        run: go build -o gale ./cmd/gale/

      - name: Pipeline test layer check
        if: github.event_name == 'pull_request'
        run: scripts/check-pipeline-tests.sh origin/main

      - name: Integration (Tier A)
        run: go test -tags=integration -timeout 5m ./integration/...
