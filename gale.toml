# Assume git from PATH. This is a note, not a package
# pin. gale does not fetch git. macOS already ships it.
# See docs/dev/proposals/fetch-dont-build.md §8c / §8e.
git = "system"

[packages]
  gale = "0.21.3"
  go = "1.26.1"
  gofumpt = "0.10.0"
  golangci-lint = "2.11.4"
  just = "1.48.0"
  zstd = "1.5.7"
